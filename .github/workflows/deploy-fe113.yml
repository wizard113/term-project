name: Deploy Next.js (web) to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-fe113.yml'

  workflow_dispatch:

env:
  APP_NAME: web

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm turbo build --filter=web

      - name: Prepare deployment package
        run: |

          mkdir deploy

          #
          # standalone 결과 복사
          #
          cp -a apps/web/.next/standalone/. deploy/

          #
          # static
          #
          mkdir -p deploy/apps/web/.next
          cp -a apps/web/.next/static deploy/apps/web/.next/

          #
          # public
          #
          if [ -d apps/web/public ]; then
            cp -a apps/web/public deploy/apps/web/
            cp -a apps/web/public deploy/
          fi

          #
          # Azure App Service용 server.js
          #
          cat <<EOF > deploy/server.js
          const path = require("path");
          process.chdir(path.join(__dirname, "apps/web"));
          require("./apps/web/server.js");
          EOF

      - name: Zip package
        run: |
          cd deploy
          zip -r ../release.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: release.zip

  deploy:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: deploy-fe113
          slot-name: Production
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F04AAB5CCACF4C2BA080D6B96649E287 }}
