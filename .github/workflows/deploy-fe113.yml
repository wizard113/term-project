name: Deploy Next.js (web) to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-fe113.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: deploy-fe113
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          API_URL: ${{ secrets.API_URL }}
        run: pnpm turbo build --filter=web

      - name: Prepare deployment package
        run: |
          set -euo pipefail
          SERVER=$(find apps/web/.next/standalone -type f -path '*/apps/web/server.js' | head -1)
          PREFIX="${SERVER%/apps/web/server.js}"

          rm -rf deploy && mkdir deploy
          cp -R "$PREFIX/." deploy/
          mkdir -p deploy/apps/web/.next/static deploy/apps/web/public
          cp -R apps/web/.next/static/. deploy/apps/web/.next/static/
          [ -d apps/web/public ] && cp -R apps/web/public/. deploy/apps/web/public/
          echo "require('./apps/web/server.js');" > deploy/server.js

      - name: Zip package
        run: cd deploy && zip -qry ../release.zip .   # -y: 심링크 보존

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F04AAB5CCACF4C2BA080D6B96649E287 }}
