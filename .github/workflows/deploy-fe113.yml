name: Build and deploy Node.js app to Azure Web App - test-app

on:
  push:
    branches:
      - main
      paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-fe113.yml'
  workflow_dispatch:

env:
  # 💡 [설정] 배포할 Turborepo 내 앱 이름 (apps/web 인 경우 'web')
  APP_NAME: 'web'

jobs:
  build:
    runs-on: ubuntu-latest
    # env:
    #   JWT_SECRET: ${{ secrets.JWT_SECRET }}
    #   DATABASE_URL: ${{ secrets.DATABASE_URL }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build
        run: npm run build

      # App Service에 올릴 배포 폴더 생성 및 Turborepo 구조에 맞춘 파일 복사
      - name: Prepare deploy package
        run: |
          mkdir deploy

          echo "1. standalone 전체 결과물 복사"
          # Turborepo standalone의 진입점 및 의존성을 복사합니다.
          cp -a .next/standalone/. deploy/

          echo "2. 깨지기 쉬운 standalone node_modules 정리"
          rm -rf deploy/node_modules

          echo "3. 루트 node_modules 프로덕션용 정리 후 물리 파일 복사"
          npm prune --production
          cp -r node_modules deploy/

          echo "4. Turborepo 전용 static 및 public 정적 자원 복사"
          # standalone 내부의 해당 앱 경로 아래에 .next/static 구조를 만듭니다.
          mkdir -p deploy/apps/${{ env.APP_NAME }}/.next
          cp -a apps/${{ env.APP_NAME }}/.next/static deploy/apps/${{ env.APP_NAME }}/.next/

          # public 폴더가 존재하는 경우 해당 앱 위치 및 루트 실행 위치에 복사
          if [ -d "apps/${{ env.APP_NAME }}/public" ]; then
            cp -a apps/${{ env.APP_NAME }}/public deploy/apps/${{ env.APP_NAME }}/
            # Azure 실행 호환성을 위해 최상위 루트에도 public 배치
            cp -a apps/${{ env.APP_NAME }}/public deploy/
          fi

          echo "5. Azure Web App 진입점(server.js) 링크 또는 래퍼 생성"
          # Turborepo는 standalone 진입점이 deploy/apps/web/server.js에 위치합니다.
          # Azure가 루트의 server.js를 바로 실행할 수 있도록 진입점 스크립트를 작성해줍니다.
          cat << 'EOF' > deploy/server.js
          const path = require('path');
          process.chdir(path.join(__dirname, 'apps/${{ env.APP_NAME }}'));
          require('./apps/${{ env.APP_NAME }}/server.js');
          EOF

          echo "===== 배포용 폴더 구조 최종 확인 ====="
          ls -la deploy
          ls -la deploy/apps/${{ env.APP_NAME }}

      # 배포 폴더를 zip 파일로 압축
      - name: Zip artifact for deployment
        run: |
          cd deploy
          zip -r ../release.zip .
          cd ..

      # 압축된 release.zip 파일을 아티팩트로 업로드
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 압축 파일 아티팩트 다운로드
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Azure Web App에 Zip 패키지 배포
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: test-app
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F04AAB5CCACF4C2BA080D6B96649E287 }}
          package: release.zip
